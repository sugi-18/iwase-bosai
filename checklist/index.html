<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>防災チェックリスト｜岩瀬自治会</title>

<link rel="stylesheet" href="style.css">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<!-- PDF保存 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<div class="container">

<h1>✅ 防災チェックリスト</h1>

<p class="sub">
あなたの防災対策状況を診断します
</p>

<p id="restoreNotice" class="save-status" style="display:none;"></p>

<!-- 家の安全 -->

<div class="card">

<h2>🏠 家の安全</h2>

<label><input type="checkbox" data-category="home" data-key="home_1" data-text="家具を固定している">家具を固定している</label>

<label><input type="checkbox" data-category="home" data-key="home_2" data-text="住宅用火災警報器を点検している（1年に1回）">住宅用火災警報器を点検している（1年に1回）</label>

<label><input type="checkbox" data-category="home" data-key="home_3" data-text="感震ブレーカーを設置している">感震ブレーカーを設置している</label>

<label><input type="checkbox" data-category="home" data-key="home_4" data-text="消火器を設置している">消火器を設置している</label>

<label><input type="checkbox" data-category="home" data-key="home_5" data-text="ガラス飛散防止対策をしている">ガラス飛散防止対策をしている</label>

</div>

<!-- 備蓄 -->

<div class="card">

<h2>🎒 備蓄</h2>

<label><input type="checkbox" data-category="stock" data-key="stock_1" data-text="飲料水3日分">飲料水3日分</label>

<label><input type="checkbox" data-category="stock" data-key="stock_2" data-text="食料3日分">食料3日分</label>

<label><input type="checkbox" data-category="stock" data-key="stock_3" data-text="携帯トイレ">携帯トイレ</label>

<label><input type="checkbox" data-category="stock" data-key="stock_4" data-text="非常用持ち出しセット">非常用持ち出しセット</label>

<label><input type="checkbox" data-category="stock" data-key="stock_5" data-text="モバイルバッテリー">モバイルバッテリー</label>

</div>

<!-- 避難 -->

<div class="card">

<h2>🚶 避難</h2>

<label><input type="checkbox" data-category="evac" data-key="evac_1" data-text="避難場所を知っている">避難場所を知っている</label>

<label><input type="checkbox" data-category="evac" data-key="evac_2" data-text="避難経路を確認している">避難経路を確認している</label>

<label><input type="checkbox" data-category="evac" data-key="evac_3" data-text="ハザードマップを確認した">ハザードマップを確認した</label>

<label><input type="checkbox" data-category="evac" data-key="evac_4" data-text="マイ・タイムラインを作成している">マイ・タイムラインを作成している</label>

<label><input type="checkbox" data-category="evac" data-key="evac_5" data-text="家族との連絡方法を決めている">家族との連絡方法を決めている</label>

</div>

<!-- 地域 -->

<div class="card">

<h2>🤝 地域</h2>

<label><input type="checkbox" data-category="community" data-key="community_1" data-text="自治会の防災計画を確認している">自治会の防災計画を確認している</label>

<label><input type="checkbox" data-category="community" data-key="community_2" data-text="防災訓練に参加したことがある（過去3年間）">防災訓練に参加したことがある（過去3年間）</label>

<label><input type="checkbox" data-category="community" data-key="community_3" data-text="最寄りのAED設置場所を把握している">最寄りのAED設置場所を把握している</label>

<label><input type="checkbox" data-category="community" data-key="community_4" data-text="地域の消火栓を知っている">地域の消火栓を知っている</label>

<label><input type="checkbox" data-category="community" data-key="community_5" data-text="防災倉庫の場所を知っている">防災倉庫の場所を知っている</label>

</div>

<button onclick="diagnose()">
診断する
</button>

<!-- 結果 -->

<div id="result" class="card" style="display:none;">

<h2>診断結果</h2>

<h1 id="score"></h1>

<h3 id="rank"></h3>

<div class="chart-area">

<canvas id="radarChart"></canvas>

</div>

<h3>改善すると良い項目</h3>

<ul id="adviceList"></ul>

<p id="saveStatus" class="save-status"></p>

<button onclick="savePDF()">
📄 PDF保存
</button>

</div>

<div style="margin-top:30px;">

<a href="../">
トップページへ戻る
</a>

</div>

</div>

<!-- ==================================================
     Supabase

     診断結果を自治会側で集計するため、
     結果を保存する。
================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../stamp/supabase.js"></script>

<script src="../common/iwase-identity.js"></script>

<script src="../common/community.js"></script>

<script src="script.js"></script>

<script src="../common/appearance.js"></script>

<script src="../common/pwa.js"></script>
  

<script src="../common/tracking.js"></script>

</body>

</html>
