<style>

body {
    font-family: sans-serif;
    text-align: center;

}


h1 {
    color: #1f4e79;
}


/* タイトル部分 */

.title-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
}


.title-main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}


.character {
    width:120px;
}


.title-area h1 {
    margin:0;
}


.title-area p {
    margin:5px 0;
}



/* パソコン表示 */

@media screen and (min-width:600px){

    .title-main {
        flex-direction: row;
        justify-content:center;
        align-items:center;
        gap:20px;
    }

    .character {
        width:140px;
    }

}



/* メニュー */

.menu {
    margin-top:10px;
}



/* カード */

.card {
    background:white;
    width:90%;
    max-width:400px;
    margin:15px auto;
    padding:20px;
    border-radius:10px;
}



/* ボタン */

a {
    display:block;
    text-decoration:none;
    color:white;
    background:#1f77b4;
    padding:15px;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
    transition:0.3s;
}


/* ホバー効果 */

a:hover {
    background:#155a8a;
    transform:scale(1.03);
}



/* ロゴ */

.logo {
    width:80%;
    max-width:400px;
    margin-top:20px;
}

.training-section {
    margin: 40px 15px;
    text-align: center;
}


.training-section h2 {
    background-color: #d62828;
    color:white;
    padding:15px;
    border-radius:10px;
}


.training-menu {
    display:flex;
    flex-direction:column;
    gap:15px;
}


.training-card {

    display:block;
    text-decoration:none;
    color:#333;

    background:white;

    padding:20px;

    border-radius:15px;

    box-shadow:0 4px 8px rgba(0,0,0,0.15);

    transition:0.3s;

}


.training-card:hover {

    transform:translateY(-5px);

    background:#fff3f3;

}


.training-card h3 {

    margin-top:0;

    color:#d62828;

}


.training-card p {

    font-size:14px;

}
