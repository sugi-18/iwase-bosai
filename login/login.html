<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>岩瀬自治会 防災アプリ ログイン</title>

<link rel="stylesheet" href="login.css">

</head>


<body>


<div class="login-container">


<h1>
🚒 岩瀬自治会<br>
防災アプリ
</h1>


<p class="login-message">

利用するには<br>
パスワードを入力してください。

</p>


<div class="login-box">


<input
type="password"
id="password"
placeholder="パスワード入力"
autocomplete="current-password"
>


<button onclick="login()">

ログイン

</button>


<p id="error-message"></p>


</div>


<div class="notice">


<h2>ご利用について</h2>


<p>

本アプリは岩瀬自治会の防災活動を支援、展開するための地域防災情報アプリです。

</p>


<p>

認証後24時間利用できます。

</p>


</div>


</div>


<script src="login.js"></script>


</body>

</html>
