<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
岩瀬自治会 防災アプリ ログイン
</title>


<link rel="stylesheet" href="login.css">


</head>


<body>


<div class="login-container">


<h1>
🛡️ 岩瀬自治会<br>
防災アプリ
</h1>


<p class="login-description">

地域専用防災アプリです。<br>
地域コードを入力してください。

</p>



<div class="login-card">


<h2>
地域コード
</h2>


<input
type="text"
id="communityCode"
placeholder="例：IWASE2026"
>



<h2>
利用区分
</h2>


<div class="role-area">


<label>

<input
type="radio"
name="role"
value="member"
checked
>

自治会員

</label>



<label>

<input
type="radio"
name="role"
value="guest"
>

一般利用

</label>


</div>




<button
onclick="login()"
>

ログイン

</button>


<p id="message"></p>


</div>



<footer>

岩瀬自治会 防災活動

</footer>



</div>


<script src="login.js"></script>


</body>


</html>
