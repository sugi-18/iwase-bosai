<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    アンケート | 岩瀬自治会 防災
</title>

<meta
    name="description"
    content="岩瀬自治会のアンケートに回答できます。記名・匿名を選べます。"
>

<link
    rel="stylesheet"
    href="../style.css"
>

<link
    rel="stylesheet"
    href="../common/community.css"
>

<script src="../common/appearance.js"></script>

</head>


<body>


<div class="title-area">

    <div class="title-main">

        <img
            src="../images/bosai-iwapon.png"
            class="character"
            alt="防災キャラクター"
        >

        <h1>
            📝 アンケート
        </h1>

    </div>

    <p>
        自治会からのアンケートです。記名・匿名どちらでも回答できます
    </p>

</div>


<main class="tool-page">


    <!-- ==================================================
         一覧
    ================================================== -->

    <section id="surveyListArea">

        <div
            id="surveyList"
            class="tool-list"
        >

            <div class="tool-loading">
                読み込み中...
            </div>

        </div>

    </section>


    <!-- ==================================================
         回答画面
    ================================================== -->

    <section
        id="surveyFormArea"
        style="display:none;"
    >

        <div class="tool-card">

            <h2 id="surveyTitle"></h2>

            <p id="surveyDescription"></p>

            <div id="surveyPeriod"
                 style="
                     color:#777;
                     font-size:14px;
                     margin-bottom:4px;
                 "></div>

        </div>


        <!-- 記名・匿名 -->

        <div class="tool-card">

            <h3>
                お名前の扱い
            </h3>

            <div id="surveyNameArea"></div>

        </div>


        <!-- 設問 -->

        <div class="tool-card">

            <h3>
                設問
            </h3>

            <div id="surveyQuestions">

                <div class="tool-loading">
                    読み込み中...
                </div>

            </div>

        </div>


        <div id="surveyMessage"></div>


        <button
            type="button"
            id="surveySubmitButton"
            class="tool-button"
        >
            回答を送信する
        </button>


        <button
            type="button"
            id="surveyBackButton"
            class="tool-button tool-button-sub"
        >
            アンケート一覧へ戻る
        </button>

    </section>


    <a
        href="./tools.html"
        class="back-button"
    >
        🧰 岩瀬自治会ツールへ戻る
    </a>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../stamp/supabase.js"></script>

<script src="../common/iwase-identity.js"></script>

<script src="../common/community.js"></script>

<script src="./survey.js"></script>

<script src="../common/pwa.js"></script>

</body>

</html>
