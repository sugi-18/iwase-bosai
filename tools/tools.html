<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    岩瀬自治会ツール | 岩瀬自治会 防災
</title>

<meta
    name="description"
    content="岩瀬自治会のアンケートと掲示板を利用できます。"
>

<link
    rel="stylesheet"
    href="../style.css"
>

<link
    rel="stylesheet"
    href="../common/community.css"
>

<script src="../common/appearance.js"></script>

</head>


<body>


<div class="title-area">

    <div class="title-main">

        <img
            src="../images/bosai-iwapon.png"
            class="character"
            alt="防災キャラクター"
        >

        <h1>
            🧑‍🤝‍🧑 岩瀬自治会ツール
        </h1>

    </div>

    <p>
        自治会の中で声を集め、伝え合うための道具です
    </p>

</div>


<main class="tool-page">


    <!-- ==================================================
         アンケート
    ================================================== -->

    <div class="card">

        <h2>
            📝 アンケート
        </h2>

        <p>
            自治会からのアンケートに<br>
            回答できます
        </p>

        <a href="./survey.html">
            回答する
        </a>

        <p
            id="surveyStatus"
            style="
                margin: 12px 0 0;
                font-size: 14px;
                color: #666;
            "
        >
            確認中...
        </p>

    </div>


    <!-- ==================================================
         掲示板
    ================================================== -->

    <div class="card">

        <h2>
            💬 自治会掲示板
        </h2>

        <p>
            ふだんの交流や、災害時の<br>
            被害報告に使えます
        </p>

        <a href="./board.html">
            掲示板を見る
        </a>

        <p
            id="boardStatus"
            style="
                margin: 12px 0 0;
                font-size: 14px;
                color: #666;
            "
        >
            確認中...
        </p>

    </div>


    <!-- ==================================================
         使い方
    ================================================== -->

    <div class="tool-card">

        <h2>
            使うときのお願い
        </h2>

        <p>
            ・掲示板の投稿名は自由に決められます。<br>
            ・アンケートは、記名でも匿名でも回答できます。<br>
            ・災害時の被害報告は「被害報告」を選んでください。<br>
            ・人を傷つける内容は書かないでください。
        </p>

        <p>
            緊急の通報は、掲示板ではなく消防（119番）・警察（110番）へお願いします。
        </p>

    </div>


    <a
        href="../index.html"
        class="back-button"
    >
        🏠 トップページへ戻る
    </a>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../stamp/supabase.js"></script>

<script src="../common/iwase-identity.js"></script>

<script src="../common/community.js"></script>


<script>

"use strict";


/* ==================================================
   いま使える状態かを表示する

   一覧を開かなくても、
   新しいものがあるかどうかが分かるようにする。
================================================== */

async function loadStatus() {

    const surveyStatus =
        document.getElementById("surveyStatus");

    const boardStatus =
        document.getElementById("boardStatus");


    /* ---------- アンケート ---------- */

    try {

        const today =
            new Date().toISOString().slice(0, 10);


        const { data, error } =
            await supabaseClient
                .from("surveys")
                .select("id, end_date")
                .eq("is_published", true);


        if (error) {
            throw error;
        }


        const open =
            (data || []).filter(
                item =>
                    !item.end_date ||
                    item.end_date >= today
            );


        surveyStatus.textContent =
            open.length > 0
                ? "受付中のアンケート " + open.length + "件"
                : "現在受付中のアンケートはありません";

    }
    catch (error) {

        console.error("アンケート件数の取得エラー:", error);

        surveyStatus.textContent = "";

    }


    /* ---------- 掲示板 ---------- */

    try {

        const { count, error } =
            await supabaseClient
                .from("board_posts")
                .select("id", { count: "exact", head: true })
                .eq("is_hidden", false);


        if (error) {
            throw error;
        }


        boardStatus.textContent =
            "投稿 " + (count || 0) + "件";

    }
    catch (error) {

        console.error("投稿件数の取得エラー:", error);

        boardStatus.textContent = "";

    }

}


document.addEventListener(
    "DOMContentLoaded",
    async () => {

        await window.IwaseIdentity.load();

        if (!window.IwaseCommunity.requireMember()) {

            return;

        }


        loadStatus();

    }
);

</script>


<script src="../common/pwa.js"></script>

<script src="../common/tracking.js"></script>

</body>

</html>
