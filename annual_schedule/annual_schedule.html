<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>年間計画</title>

<link rel="stylesheet" href="../style.css">

<style>

.annual-plan {
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;
    text-align: center;
}

.annual-plan h1 {
    font-size: 32px;
    margin-bottom: 25px;
}

.schedule-image {
    width: 100%;
    max-width: 800px;
    height: auto;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}


/* 戻るボタン */

.back-button {

    display: inline-block;
    margin-top: 30px;
    padding: 15px 35px;

    background-color: #1976d2;
    color:white;

    text-decoration:none;

    border-radius:30px;

    font-size:18px;

    transition:0.3s;

}


.back-button:hover {

    background-color:#0d47a1;

    transform:scale(1.05);

}



@media(max-width:600px){

    .annual-plan h1{
        font-size:24px;
    }

    .annual-plan{
        padding:10px;
    }

}

</style>

</head>


<body>


<section class="annual-plan">


<h1>
🗓️ 年間計画
</h1>


<img
src="schedule.JPG"
alt="年間計画"
class="schedule-image"
>


<br>


<a href="../index.html" class="back-button">
トップページへ戻る
</a>


</section>


</body>

</html>
