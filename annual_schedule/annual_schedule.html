<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>年間計画</title>


<link
    rel="stylesheet"
    href="../style.css"
>


<style>

/* ==================================================
   年間計画
================================================== */

.annual-plan {

    max-width: 900px;

    margin: 30px auto;

    padding: 20px;

    text-align: center;

}


.annual-plan h1 {

    font-size: 32px;

    margin-bottom: 25px;

}


/* ==================================================
   写真一覧
================================================== */

.schedule-gallery {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 20px;

}


.schedule-image {

    width: 100%;

    max-width: 800px;

    height: auto;

    display: block;

    border-radius: 15px;

    box-shadow:
        0 4px 10px
        rgba(0, 0, 0, 0.2);

}


/* ==================================================
   読み込み中
================================================== */

.loading-message {

    padding: 30px;

    color: #777;

}


/* ==================================================
   登録なし
================================================== */

.empty-message {

    padding: 30px 20px;

    color: #777;

    background-color: #eeeeee;

    border-radius: 10px;

}


/* ==================================================
   エラー
================================================== */

.error-message {

    padding: 20px;

    color: #b71c1c;

    background-color: #ffebee;

    border-radius: 10px;

    line-height: 1.7;

}


/* ==================================================
   戻るボタン
================================================== */

.back-button {

    display: inline-block;

    margin-top: 30px;

    padding: 15px 35px;

    background-color: #1976d2;

    color: white;

    text-decoration: none;

    border-radius: 30px;

    font-size: 18px;

    transition: 0.3s;

}


.back-button:hover {

    background-color: #0d47a1;

    transform: scale(1.05);

}


/* ==================================================
   スマホ
================================================== */

@media (max-width: 600px) {

    .annual-plan h1 {

        font-size: 24px;

    }


    .annual-plan {

        padding: 10px;

    }


    .schedule-gallery {

        gap: 15px;

    }

}

</style>

</head>


<body>


<section class="annual-plan">


    <h1>
        🗓️ 年間計画
    </h1>


    <!-- ==================================================
         写真表示エリア
    ================================================== -->

    <div
        id="scheduleGallery"
        class="schedule-gallery"
    >

        <div class="loading-message">
            読み込み中...
        </div>

    </div>


    <a
        href="../index.html"
        class="back-button"
    >
        トップページへ戻る
    </a>


</section>


<!-- ==================================================
     Supabase
================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* ==================================================
   Supabase設定
================================================== */

const SUPABASE_URL =
    "https://zumbqukrojdpgfpfekjr.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_8YXsMHOxLr7MOTEYShUM3w_LsZvR3Qn";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* ==================================================
   年間計画読み込み
================================================== */

async function loadSchedule() {

    const gallery =
        document.getElementById(
            "scheduleGallery"
        );


    if (!gallery) {

        return;

    }


    gallery.innerHTML = `
        <div class="loading-message">
            読み込み中...
        </div>
    `;


    try {

        /*
           site_contentsから
           annual_scheduleのレコードを取得
           
           現在のDB構造：
           
           image1_url
           image2_url
           image3_url
        */

        const {
            data,
            error
        } =
        await supabaseClient

            .from("site_contents")

            .select(
                "id, content_type, image1_url, image2_url, image3_url"
            )

            .eq(
                "content_type",
                "annual_schedule"
            )

            .limit(1);


        /* ------------------------------------------
           Supabaseエラー
        ------------------------------------------ */

        if (error) {

            console.error(
                "site_contents取得エラー:",
                error
            );

            throw error;

        }


        gallery.innerHTML = "";


        /* ------------------------------------------
           データなし
        ------------------------------------------ */

        if (
            !data ||
            data.length === 0
        ) {

            gallery.innerHTML = `
                <div class="empty-message">
                    現在、年間計画は登録されていません。
                </div>
            `;

            return;

        }


        const content =
            data[0];


        /* ------------------------------------------
           3枚の画像URL
        ------------------------------------------ */

        const imageUrls = [

            content.image1_url,

            content.image2_url,

            content.image3_url

        ].filter(
            url =>
                url &&
                String(url).trim() !== ""
        );


        /* ------------------------------------------
           画像なし
        ------------------------------------------ */

        if (
            imageUrls.length === 0
        ) {

            gallery.innerHTML = `
                <div class="empty-message">
                    現在、年間計画の画像はありません。
                </div>
            `;

            return;

        }


        /* ------------------------------------------
           画像表示
        ------------------------------------------ */

        imageUrls.forEach(
            (url, index) => {

                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    String(url).trim();


                img.alt =
                    "年間計画 " +
                    (index + 1);


                img.className =
                    "schedule-image";


                img.loading =
                    "lazy";


                img.addEventListener(
                    "error",
                    () => {

                        console.error(
                            "画像読み込み失敗:",
                            img.src
                        );

                        img.style.display =
                            "none";

                    }
                );


                gallery.appendChild(
                    img
                );

            }
        );


    } catch (error) {

        console.error(
            "loadSchedule error:",
            error
        );


        gallery.innerHTML = `
            <div class="error-message">
                年間計画を読み込めませんでした。<br>
                しばらく時間をおいて再度お試しください。
            </div>
        `;

    }

}


/* ==================================================
   実行
================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadSchedule();

    }
);

</script>


</body>

</html>
