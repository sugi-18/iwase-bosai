<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    岩瀬地区防災計画 | 岩瀬自治会 防災
</title>

<meta
    name="description"
    content="岩瀬地区の地区防災計画を確認できます。"
>

<link
    rel="stylesheet"
    href="../style.css"
>

<link
    rel="stylesheet"
    href="../common/community.css"
>

<script src="../common/appearance.js"></script>

</head>


<body>


<div class="title-area">

    <div class="title-main">

        <img
            src="../images/bosai-iwapon.png"
            class="character"
            alt="防災キャラクター"
        >

        <h1>
            📘 岩瀬地区防災計画
        </h1>

    </div>

    <p>
        岩瀬自治会が作成した防災計画を確認できます
    </p>

</div>


<main class="tool-page">


    <!-- ==================================================
         地区防災計画とは
    ================================================== -->

    <div class="tool-card">

        <h2>
            地区防災計画とは
        </h2>

        <p>
            地域に住む人たちが自分たちで作り、運用していく計画です。<br>
            災害発生時にどのような方針で避難や防災活動を実施していくのかなどを、岩瀬自治会の実情に合わせて決めています。
        </p>

    </div>


    <!-- ==================================================
         計画本文（PDF）

         表紙をタップするとPDFが開く。

         一度開いた端末では、通信が無くても読める。
         リンク先を開くのではなく、
         ファイルとして取り込んでいるため。
    ================================================== -->

    <div class="tool-card">

        <h2>
            計画を読む
        </h2>

        <div id="planPdf">

            <div class="tool-loading">
                読み込み中...
            </div>

        </div>

    </div>


    <!-- ==================================================
         関連資料
    ================================================== -->

    <div class="tool-card">

        <h2>
            関連資料
        </h2>

        <div id="planDocuments">

            <div class="tool-loading">
                読み込み中...
            </div>

        </div>

    </div>


    <a
        href="../index.html"
        class="back-button"
    >
        🏠 トップページへ戻る
    </a>


</main>


<!-- ==================================================
     Supabase
================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../stamp/supabase.js"></script>

<script src="../common/iwase-identity.js"></script>

<script src="../common/community.js"></script>


<script>

"use strict";


/* ==================================================
   計画のPDF

   site_contents の content_type = 'district_plan' に
   表紙の画像とPDFを登録する。

   PDFはSupabaseに置いたファイルを読み込む。
   Service Workerがファイルを保存するため、
   一度開けば通信が無くても読める。
================================================== */

let planPdfUrl = null;

let planPdfName = "";


async function loadPlanPdf() {

    const container =
        document.getElementById("planPdf");

    if (!container) {
        return;
    }


    try {

        const { data, error } =
            await supabaseClient
                .from("site_contents")
                .select(
                    "image1_url, pdf_url, pdf_name, pdf_updated_at"
                )
                .eq("content_type", "district_plan")
                .maybeSingle();


        if (error) {
            throw error;
        }


        const escape = window.IwaseCommunity.escapeHtml;


        planPdfUrl  = data?.pdf_url || null;

        planPdfName = data?.pdf_name || "岩瀬地区防災計画.pdf";


        if (!planPdfUrl) {

            container.innerHTML = `
                <div class="tool-empty">
                    計画はまだ掲載されていません。
                </div>
            `;

            return;

        }


        const cover = data?.image1_url;


        container.innerHTML = `

            ${
                cover
                    ? `<img
                           id="planCover"
                           class="plan-cover"
                           src="${escape(cover)}"
                           alt="岩瀬地区防災計画の表紙"
                       >`
                    : `<div id="planCover" class="plan-cover-alt">
                           📄<br>岩瀬地区防災計画
                       </div>`
            }

            <button
                type="button"
                id="planOpenButton"
                class="tool-button"
            >
                計画を開く
            </button>

            <p id="planPdfNote" class="plan-note">
                ${
                    data?.pdf_updated_at
                        ? "更新日：" +
                          escape(
                              window.IwaseCommunity.formatDateTime(
                                  data.pdf_updated_at
                              )
                          ) + "<br>"
                        : ""
                }
                一度開いておくと、通信が無いときでも読めます。
            </p>
        `;


        document
            .getElementById("planOpenButton")
            .addEventListener("click", openPlanPdf);


        const coverElement =
            document.getElementById("planCover");

        if (coverElement) {

            coverElement.addEventListener("click", openPlanPdf);

        }


        /*
         * 画面を開いた時点で取り込んでおく。
         *
         * 「災害のときに開こうとしたら通信が無い」
         * という事態を避けたいので、
         * 平常時のうちに端末へ入れておく。
         */

        preloadPlanPdf();


    }
    catch (error) {

        console.error("地区防災計画の取得エラー:", error);

        container.innerHTML = `
            <div class="tool-error">
                計画を読み込めませんでした。<br>
                しばらく時間をおいて再度お試しください。
            </div>
        `;

    }

}


/* ==================================================
   先に取り込んでおく
================================================== */

async function preloadPlanPdf() {

    if (!planPdfUrl) {
        return;
    }


    try {

        await fetch(planPdfUrl, { mode: "cors" });

        console.log("地区防災計画のPDFを取り込みました。");

    }
    catch (error) {

        console.warn(
            "PDFを取り込めませんでした:",
            error
        );

    }

}


/* ==================================================
   PDFを開く

   直接リンクを開くと、通信が無いときに
   何も表示されない。
   （別のサイトへの移動になるため、
     アプリが保存したファイルを使えない）

   そこで、いったんファイルとして読み込んでから開く。
================================================== */

async function openPlanPdf() {

    if (!planPdfUrl) {
        return;
    }


    const note =
        document.getElementById("planPdfNote");


    if (note) {

        note.textContent = "計画を開いています...";

    }


    try {

        const response = await fetch(planPdfUrl);


        if (!response.ok) {

            throw new Error("状態コード " + response.status);

        }


        const blob = await response.blob();


        const objectUrl =
            URL.createObjectURL(
                new Blob(
                    [blob],
                    { type: "application/pdf" }
                )
            );


        const opened =
            window.open(objectUrl, "_blank");


        if (!opened) {

            /* 新しい画面を開けない設定のとき */

            location.href = objectUrl;

        }


        if (note) {

            note.innerHTML =
                "別の画面で開きました。<br>" +
                "戻るときは、この画面に切り替えてください。";

        }


        /*
         * すぐに開放すると表示できない端末があるため、
         * 少し待ってから片づける。
         */

        setTimeout(
            () => {
                URL.revokeObjectURL(objectUrl);
            },
            60000
        );


    }
    catch (error) {

        console.error("PDFを開けませんでした:", error);


        if (note) {

            note.innerHTML =
                "計画を開けませんでした。<br>" +
                "通信ができる場所で一度開いておくと、" +
                "次からは通信が無くても読めます。";

        }

    }

}


/* ==================================================
   関連資料

   custom_contents の category = 'district_plan'
================================================== */

async function loadPlanDocuments() {

    const container =
        document.getElementById("planDocuments");

    if (!container) {
        return;
    }


    try {

        const { data, error } =
            await supabaseClient
                .from("custom_contents")
                .select("id, title, description, url, icon")
                .eq("category", "district_plan")
                .eq("is_published", true)
                .order("display_order", { ascending: true })
                .order("created_at", { ascending: true });


        if (error) {
            throw error;
        }


        if (!data || data.length === 0) {

            container.innerHTML = `
                <div class="tool-empty">
                    関連資料はまだ登録されていません。
                </div>
            `;

            return;

        }


        const escape = window.IwaseCommunity.escapeHtml;


        container.innerHTML =
            data.map(
                item => `
                    <a
                        class="link-button"
                        href="${escape(item.url || "#")}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        ${escape(item.icon || "📄")}
                        ${escape(item.title)}
                    </a>
                    ${
                        item.description
                            ? `<p style="
                                    margin:-6px 0 16px;
                                    color:#666;
                                    font-size:14px;
                                    line-height:1.7;
                               ">${escape(item.description)}</p>`
                            : ""
                    }
                `
            ).join("");


    }
    catch (error) {

        console.error("関連資料の取得エラー:", error);

        container.innerHTML = `
            <div class="tool-error">
                関連資料を読み込めませんでした。
            </div>
        `;

    }

}


document.addEventListener(
    "DOMContentLoaded",
    async () => {

        /*
         * 会員向けの機能。
         * 会員以外には案内を出して終わる。
         */

        await window.IwaseIdentity.load();

        if (!window.IwaseCommunity.requireMember()) {

            return;

        }


        loadPlanPdf();

        loadPlanDocuments();

    }
);

</script>


<script src="../common/pwa.js"></script>

<script src="../common/tracking.js"></script>

</body>

</html>
