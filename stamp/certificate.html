<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>いわぽん防災マイスター認定証</title>

<link rel="stylesheet"
href="certificate.css">

</head>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script src="certificate.js"></script>
    
<body>

<div id="certificate">

    <div class="outer-border">

        <div class="inner-border">

            <div class="logo">

                <!-- 岩瀬自治会ロゴ -->
                <img
                src="../images/logo.png"
                id="logo"
                alt="logo">

            </div>

            <h3 class="community">

                岩瀬自治会

            </h3>

            <h1 class="title">

                🏅

                いわぽん防災マイスター

            </h1>

            <h2 class="subtitle">

                認　定　証

            </h2>

            <p class="name">

                <span id="username"></span>

                様

            </p>

            <div class="message">

                <p>

                あなたは岩瀬自治会が実施する

                </p>

                <p>

                防災訓練及び防災講座へ

                積極的に参加し、

                </p>

                <p>

                地域防災力向上に

                貢献されました。

                </p>

                <br>

                <p>

                ここに

                </p>

                <p class="master">

                「いわぽん防災マイスター」

                </p>

                <p>

                として認定します。

                </p>

            </div>

            <div class="info">

                <p>

                    認定番号

                    <span id="number"></span>

                </p>

                <p>

                    認定日

                    <span id="today"></span>

                </p>

            </div>

            <div class="footer">

                <div>

                    岩瀬自治会

                    <br>

                    自主防災部

                </div>

                <div>

                    <img

                    src="../images/stamp.png"

                    id="seal"

                    alt="seal">

                </div>

            </div>

        </div>

    </div>

</div>

<script src="certificate.js"></script>

</body>

</html>
