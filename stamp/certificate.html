　<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
いわぽん防災マイスター認定証
</title>


<link rel="stylesheet" href="certificate.css">


</head>


<body>


<div id="certificate">


<h1>
認定証
</h1>



<p>

あなたは防災訓練・講座に積極的に参加し、
地域防災力向上に貢献しました。

</p>



<h2>
いわぽん防災マイスター
</h2>


<p>
として認定します。
</p>





<div class="info">


<p>
氏名：
<span id="name"></span>
</p>


<p>
認定日：
<span id="date"></span>
</p>


<p>
認定番号：
<span id="number"></span>
</p>


</div>




<p class="organization">

岩瀬自治会

</p>


</div>




<button id="pdf-button">

PDF保存

</button>





<script src="js/html2pdf.bundle.min.js"></script>


<script>


const data =

JSON.parse(

localStorage.getItem(
"iwaseStamp"
)

);



if(data){


document
.getElementById("name")
.textContent=

data.name;



document
.getElementById("date")
.textContent=

new Date()
.toLocaleDateString(
"ja-JP"
);



document
.getElementById("number")
.textContent=

"IWASE-"

+

data.id;



}






document
.getElementById("pdf-button")
.addEventListener(

"click",

function(){



const element =

document
.getElementById("certificate");





html2pdf()

.set({

margin:10,


filename:

"いわぽん防災マイスター認定証.pdf",


html2canvas:{


scale:2

},


jsPDF:{


format:"a4",


orientation:"portrait"


}


})

.from(element)

.save();



}

);



</script>


</body>

</html>
