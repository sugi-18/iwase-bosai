<script>
/* ==================================================
   置き場所のちがいへの対応

   QRコードは管理者画面で作っている。
   管理者画面と利用者向けアプリは
   別のアドレスで公開しているため、
   QRの行き先が管理者側になることがある。

   その場合、ホーム画面に追加したアプリとは
   別の場所として扱われ、利用者情報が
   引き継がれないことがある。

   管理者側で開かれたときは、
   利用者向けのアドレスへ送り直す。
   配布済みの古いQRコードもそのまま使える。

   APP_BASE_URL … 利用者が使うアプリのアドレス
   ADMIN_MARK    … 管理者側のアドレスに含まれる文字
================================================== */

(function () {

    "use strict";

    var APP_BASE_URL =
        "https://sugi-18.github.io/iwase-bosai/";

    var ADMIN_MARK = "iwase-bosai.adm";


    try {

        if (
            APP_BASE_URL &&
            location.href.indexOf(ADMIN_MARK) !== -1
        ) {

            location.replace(
                APP_BASE_URL +
                "stamp/training.html" +
                location.search
            );

        }

    }
    catch (error) {

        console.warn("転送に失敗:", error);

    }

})();
</script>
