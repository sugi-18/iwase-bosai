<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
いわぽん防災マイスター スタンプカード
</title>

<link rel="stylesheet" href="stamp.css">

</head>


<body>


<div class="stamp-container">


<h1>
🛡️ いわぽん防災マイスター<br>
スタンプカード
</h1>



<!-- 登録 -->

<section id="register-area">


<h2>
利用者登録
</h2>


<p>
氏名を入力してください
</p>


<input
type="text"
id="username"
placeholder="氏名">


<br>


<button id="register-button">
登録する
</button>


</section>





<!-- カード -->

<section id="card-area" style="display:none;">



<h2>
防災参加カード
</h2>



<p id="user-name"></p>



<div class="count-box">

<span id="stamp-count">
0
</span>

/5回

</div>



<p id="message"></p>





<!-- スタンプ追加 -->

<div class="add-area">


<h3>
参加記録追加
</h3>


<input
type="date"
id="stamp-date">



<input
type="text"
id="stamp-event"
placeholder="訓練内容">


<br>


<button id="add-button">

スタンプ追加

</button>


</div>






<!-- 履歴 -->

<div id="history">


<h3>
参加履歴
</h3>


<ul id="history-list">

</ul>


</div>



</section>



</div>




<script src="stamp.js"></script>


</body>

</html>
