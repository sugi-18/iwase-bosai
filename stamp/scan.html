<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    QR読み取り | 岩瀬自治会 防災
</title>

<meta
    name="description"
    content="訓練のQRコードを読み取って参加登録します。受付番号での登録もできます。"
>

<link rel="stylesheet" href="../style.css">

<link rel="stylesheet" href="../common/community.css">

<script src="../common/appearance.js"></script>


<style>

/* ==================================================
   カメラの表示

   画面いっぱいにせず、枠に収める。
   どこを写せばよいかを分かりやすくするため。
================================================== */

.scan-frame {

    position: relative;

    width: 100%;

    max-width: 420px;

    margin: 0 auto 16px;

    background: #000000;

    border-radius: 12px;

    overflow: hidden;

    aspect-ratio: 1 / 1;

}


.scan-frame video {

    display: block;

    width: 100%;

    height: 100%;

    object-fit: cover;

}


.scan-guide {

    position: absolute;

    top: 15%;

    left: 15%;

    right: 15%;

    bottom: 15%;

    border: 3px solid rgba(255, 255, 255, 0.9);

    border-radius: 10px;

    pointer-events: none;

}


.scan-hidden {

    display: none;

}


.code-input {

    font-size: 28px;

    text-align: center;

    letter-spacing: 0.4em;

}

</style>

</head>


<body>


<div class="title-area">

    <div class="title-main">

        <img
            src="../images/bosai-iwapon.png"
            class="character"
            alt="防災キャラクター"
        >

        <h1>
            📷 QR読み取り
        </h1>

    </div>

    <p>
        訓練のQRコードを読み取って参加登録します
    </p>

</div>


<main class="tool-page">


    <!-- ==================================================
         QR読み取り
    ================================================== -->

    <div class="tool-card">

        <h2>
            QRコードを読み取る
        </h2>

        <p>
            受付にあるQRコードを、枠の中に写してください。読み取れると自動で次に進みます。
        </p>


        <div id="scanMessage"></div>


        <div
            id="scanFrame"
            class="scan-frame scan-hidden"
        >

            <video
                id="scanVideo"
                playsinline
                muted
            ></video>

            <div class="scan-guide"></div>

        </div>


        <button
            type="button"
            id="scanStartButton"
            class="tool-button"
        >
            カメラを起動する
        </button>


        <button
            type="button"
            id="scanStopButton"
            class="tool-button tool-button-sub scan-hidden"
        >
            カメラを止める
        </button>

    </div>


    <!-- ==================================================
         受付番号

         カメラが使えない方のための入口。
         こちらのほうが速い方も多い。
    ================================================== -->

    <div class="tool-card">

        <h2>
            受付番号で登録する
        </h2>

        <p>
            カメラがうまく使えないときは、受付で案内している4桁の番号を入力してください。
        </p>


        <label class="tool-label" for="codeInput">
            受付番号（4桁）
        </label>

        <input
            type="text"
            id="codeInput"
            class="tool-input code-input"
            inputmode="numeric"
            maxlength="4"
            placeholder="0000"
            autocomplete="off"
        >


        <div id="codeMessage"></div>


        <button
            type="button"
            id="codeButton"
            class="tool-button"
        >
            この番号で進む
        </button>

    </div>


    <a
        href="../training/training.html"
        class="back-button"
    >
        🚒 訓練・スタンプへ戻る
    </a>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<script src="./supabase.js"></script>

<script src="../common/iwase-identity.js"></script>

<script src="../common/community.js"></script>

<script src="./scan.js"></script>

<script src="../common/tracking.js"></script>

<script src="../common/pwa.js"></script>

</body>

</html>
