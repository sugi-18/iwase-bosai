<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    活動実績 | 岩瀬自治会 防災
</title>

<meta
    name="description"
    content="岩瀬自治会の防災活動の実績を、実施回ごとに確認できます。"
>

<link
    rel="stylesheet"
    href="../style.css"
>

<link
    rel="stylesheet"
    href="../common/community.css"
>

<script src="../common/appearance.js"></script>


<style>

/* ==================================================
   活動実績ページ

   活動が増えてきたため、
   1回分ずつ見出しだけを並べ、
   押したときに内容と写真が開くようにした。

   すべて開いたまま並べると、
   古い活動にたどり着くまでに
   画面を何度もスクロールすることになるため。
================================================== */

.record-year {

    margin: 26px 0 12px;

    padding: 0 4px;

    font-size: 18px;

    font-weight: bold;

    color: #1f4e79;

    text-align: left;

}


.record-count {

    margin: 0 0 18px;

    font-size: 14px;

    color: #777777;

    text-align: center;

}


.record-date {

    display: block;

    margin-top: 4px;

    font-size: 15px;

    font-weight: normal;

    color: #666666;

}

</style>

</head>


<body>


<div class="title-area">

    <div class="title-main">

        <img
            src="../images/bosai-iwapon.png"
            class="character"
            alt="防災キャラクター"
        >

        <h1>
            📷 活動実績
        </h1>

    </div>

    <p>
        見たい回を押すと、内容と写真が開きます
    </p>

</div>


<main class="tool-page">


    <p
        id="recordCount"
        class="record-count"
    ></p>


    <div
        id="activityList"
        class="tool-list"
    >

        <div class="tool-loading">
            読み込み中...
        </div>

    </div>


    <a
        href="../index.html"
        class="back-button"
    >
        🏠 トップページへ戻る
    </a>


</main>


<!-- ==================================================
     Supabase
================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../stamp/supabase.js"></script>

<script src="../common/iwase-identity.js"></script>

<script src="../common/community.js"></script>


<script>

"use strict";


/* ==================================================
   活動実績の読み込み
================================================== */

async function loadActivities() {

    const container =
        document.getElementById("activityList");

    const countArea =
        document.getElementById("recordCount");


    if (!container) {

        console.error("activityList が見つかりません。");

        return;

    }


    container.innerHTML = `
        <div class="tool-loading">
            読み込み中...
        </div>
    `;


    try {

        const { data, error } =
            await supabaseClient

                .from("activities")

                .select(
                    `
                    id,
                    title,
                    activity_date,
                    description,
                    image1_url,
                    image2_url,
                    image3_url,
                    is_published,
                    display_order
                    `
                )

                .eq("is_published", true)

                .order(
                    "activity_date",
                    {
                        ascending: false,
                        nullsFirst: false
                    }
                )

                .order(
                    "display_order",
                    {
                        ascending: true,
                        nullsFirst: false
                    }
                );


        if (error) {

            console.error("活動実績取得エラー:", error);

            throw error;

        }


        container.innerHTML = "";


        if (!data || data.length === 0) {

            container.innerHTML = `
                <div class="tool-empty">
                    現在、公開されている活動実績はありません。
                </div>
            `;

            countArea.textContent = "";

            return;

        }


        countArea.textContent =
            "これまでの活動 " + data.length + "回";


        /* ------------------------------------------
           年ごとに区切って並べる
        ------------------------------------------ */

        let lastYear = null;


        data.forEach((activity, index) => {

            const year =
                activity.activity_date
                    ? String(activity.activity_date).slice(0, 4)
                    : null;


            if (year && year !== lastYear) {

                const heading =
                    document.createElement("div");

                heading.className = "record-year";

                heading.textContent = year + "年";

                container.appendChild(heading);

                lastYear = year;

            }


            container.appendChild(
                createActivityItem(activity, index)
            );

        });


    }
    catch (error) {

        console.error("loadActivities error:", error);

        container.innerHTML = `
            <div class="tool-error">
                活動実績を読み込めませんでした。<br>
                しばらく時間をおいて再度お試しください。
            </div>
        `;

    }

}


/* ==================================================
   1回分の要素

   見出しを押すと本文が開く。
================================================== */

function createActivityItem(activity, index) {

    const escape = window.IwaseCommunity.escapeHtml;

    const item = document.createElement("div");

    item.className = "record-item";


    /* ---------- 見出し ---------- */

    const toggle = document.createElement("button");

    toggle.type = "button";

    toggle.className = "record-toggle";

    toggle.setAttribute("aria-expanded", "false");


    const dateText =
        activity.activity_date
            ? window.IwaseCommunity.formatDate(
                  activity.activity_date
              )
            : "";


    toggle.innerHTML =
        '<span>' +
        escape(activity.title || "活動実績") +
        (
            dateText
                ? '<span class="record-date">' +
                  escape(dateText) +
                  '</span>'
                : ''
        ) +
        '</span>' +
        '<span class="record-toggle-mark">▼ 開く</span>';


    /* ---------- 本文 ---------- */

    const body = document.createElement("div");

    body.className = "record-body hidden";


    if (activity.description) {

        const description =
            document.createElement("div");

        description.className = "record-description";

        description.textContent = activity.description;

        body.appendChild(description);

    }


    /*
     * 写真は自治会員のみ表示する。
     *
     * 会員以外は内容の文章だけを見られるようにし、
     * 参加者が写っている写真は出さない。
     */

    const showPhotos =
        window.IwaseCommunity.isMember();


    const imageUrls =
        showPhotos
            ? [

                activity.image1_url,

                activity.image2_url,

                activity.image3_url

              ].filter(
                  url => url && String(url).trim() !== ""
              )
            : [];


    if (imageUrls.length > 0) {

        const gallery = document.createElement("div");

        gallery.className = "record-gallery";


        imageUrls.forEach((url, imageIndex) => {

            const img = document.createElement("img");

            img.src = String(url).trim();

            img.alt =
                (activity.title || "活動実績") +
                " 写真" +
                (imageIndex + 1);

            img.loading = "lazy";

            img.addEventListener(
                "error",
                () => {

                    console.error(
                        "活動写真読み込み失敗:",
                        img.src
                    );

                    img.style.display = "none";

                }
            );

            gallery.appendChild(img);

        });


        body.appendChild(gallery);

    }


    if (
        !activity.description &&
        imageUrls.length === 0
    ) {

        const empty = document.createElement("p");

        empty.style.color = "#777";

        empty.textContent =
            "内容は登録されていません。";

        body.appendChild(empty);

    }


    if (!showPhotos) {

        const note = document.createElement("p");

        note.style.color = "#777";

        note.style.fontSize = "14px";

        note.textContent =
            "写真は岩瀬自治会の会員の方のみご覧いただけます。";

        body.appendChild(note);

    }


    /* ---------- 開閉 ---------- */

    toggle.addEventListener(
        "click",
        () => {

            const isHidden =
                body.classList.contains("hidden");


            if (isHidden) {

                body.classList.remove("hidden");

                toggle.setAttribute("aria-expanded", "true");

                toggle.querySelector(
                    ".record-toggle-mark"
                ).textContent = "▲ 閉じる";

            }
            else {

                body.classList.add("hidden");

                toggle.setAttribute("aria-expanded", "false");

                toggle.querySelector(
                    ".record-toggle-mark"
                ).textContent = "▼ 開く";

            }

        }
    );


    item.appendChild(toggle);

    item.appendChild(body);


    /* 一番新しい活動だけ最初から開いておく */

    if (index === 0) {

        toggle.click();

    }


    return item;

}


document.addEventListener(
    "DOMContentLoaded",
    async () => {

        /*
         * 会員区分を確定させてから描画する。
         * 先に描いてしまうと、
         * 一瞬だけ写真が見えることがある。
         */

        await window.IwaseIdentity.load();

        loadActivities();

    }
);

</script>


<script src="../common/pwa.js"></script>

<script src="../common/tracking.js"></script>

</body>

</html>
