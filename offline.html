<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    オフライン｜岩瀬自治会 防災アプリ
</title>

<meta name="theme-color" content="#1f4e79">

<style>

body {
    font-family: sans-serif;
    background: #f5f5f5;
    color: #333;
    margin: 0;
    padding: 40px 20px;
    text-align: center;
}

img {
    width: 110px;
    margin-bottom: 16px;
}

h1 {
    font-size: 20px;
    color: #1f4e79;
    margin: 0 0 12px;
}

p {
    font-size: 15px;
    line-height: 1.7;
    margin: 0 auto 20px;
    max-width: 420px;
}

.box {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    max-width: 460px;
    margin: 0 auto 16px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .08);
    text-align: left;
}

.box h2 {
    font-size: 16px;
    color: #1f4e79;
    margin: 0 0 10px;
}

.box ul {
    margin: 0;
    padding-left: 20px;
    font-size: 14px;
    line-height: 1.9;
}

button {
    background: #1f4e79;
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 12px 28px;
    font-size: 16px;
    cursor: pointer;
}

.note {
    font-size: 13px;
    color: #777;
    margin-top: 24px;
}

</style>

</head>


<body>

<img
    src="./images/bosai-iwapon.png"
    alt="いわぽん"
>

<h1>
    通信できません
</h1>

<p>
    インターネットに接続できないため、<br>
    最新の情報を読み込めませんでした。
</p>


<div class="box">

    <h2>
        通信がなくても確認できること
    </h2>

    <ul>
        <li>一度開いたことのあるページ</li>
        <li>作成済みのマイタイムライン</li>
        <li>防災力診断の入力内容</li>
    </ul>

</div>


<div class="box">

    <h2>
        いま身の安全が心配なとき
    </h2>

    <ul>
        <li>通信が使えない場合は、防災行政無線・ラジオを確認</li>
        <li>危険を感じたら、情報を待たずに避難を優先</li>
        <li>緊急時は 119 / 110</li>
    </ul>

</div>


<button onclick="location.reload();">
    再読み込み
</button>


<p class="note">
    岩瀬自治会 防災アプリ
</p>

</body>

</html>
